<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intercom Listen Test</title>
<style>
html,body{margin:0;min-height:100%;background:#061a33;color:white;font-family:system-ui,-apple-system,sans-serif}
body{display:grid;place-items:center;min-height:100vh}
main{width:min(92vw,520px);text-align:center}
button{font:inherit;font-size:1.25rem;padding:18px 28px;border-radius:14px;border:0}
.status{margin-top:18px;opacity:.9;line-height:1.5}
.small{margin-top:14px;font-size:.8rem;opacity:.65;word-break:break-all}
audio{display:none}
</style>
</head>
<body>
<main>
<h1>Listen Test</h1>
<button id="listen">Listen</button>
<div id="status" class="status">Ready.</div>
<div class="small">Channel: common-intercom-test-4022e9fe82b4</div>
<audio id="audio" autoplay playsinline></audio>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
const CHANNEL = "common-intercom-test-4022e9fe82b4";
const btn = document.getElementById('listen');
const statusEl = document.getElementById('status');
const audio = document.getElementById('audio');
let peer = null;
let conn = null;

function setStatus(s){ statusEl.textContent = s; }

btn.addEventListener('click', ()=>{
  if(peer) return;
  btn.disabled = true;
  setStatus('Opening listener…');

  peer = new Peer();

  peer.on('open', id=>{
    setStatus('Listener open — connecting…');
    conn = peer.connect(CHANNEL, {reliable:true});
    conn.on('open', ()=>{
      setStatus('Connected — waiting for live voice…');
      try { conn.send({type:'listener-ready'}); } catch(_e) {}
    });
    conn.on('error', err=> setStatus('Connection error: ' + (err.type || err.message || 'unknown')));
    conn.on('close', ()=> setStatus('Connection closed.'));
  });

  peer.on('call', call=>{
    setStatus('Media call received…');
    call.answer();
    call.on('stream', async stream=>{
      audio.srcObject = stream;
      try {
        await audio.play();
        setStatus('LIVE — receiving audio.');
      } catch(err) {
        setStatus('Connected; audio play blocked: ' + (err.name || err.message || 'error'));
        btn.disabled = false;
        btn.textContent = 'Tap to play audio';
        btn.onclick = async ()=>{ try{await audio.play(); setStatus('LIVE — receiving audio.');}catch(_e){} };
      }
    });
    call.on('close', ()=> setStatus('Broadcast ended.'));
  });

  peer.on('error', err=>{
    setStatus('Peer error: ' + (err.type || err.message || 'unknown'));
    btn.disabled = false;
  });
});
</script>
</main>
</body>
</html>
