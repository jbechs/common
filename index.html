<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>common</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#111;
      color:#fff;
      font-family:'Inter', system-ui, sans-serif;
    }

    .container{
      width:min(90vw,420px);
      display:grid;
      gap:16px;
      text-align:center;
    }

    .header{
      display:grid;
      gap:6px;
      margin-bottom:28px;
    }

    h1{
      margin:0;
      font-size:1.8rem;
      letter-spacing:.04em;
      font-weight:600;
    }

    .subtitle{
      font-size:.9rem;
      color:#aaa;
    }

    label{
      font-size:.95rem;
    }

    input, button{
      font-size:1rem;
      padding:12px;
      border-radius:8px;
      border:none;
    }

    input{
      background:#222;
      color:#fff;
    }

    button{
      background:#fff;
      color:#111;
      font-weight:600;
      cursor:pointer;
      min-width:140px;
      justify-self:center;
    }

    button:disabled{
      cursor:default;
    }

    .startNow{
      font-size:1.15rem;
      padding:16px;
    }

    .status{
      min-height:1.4em;
      color:#bbb;
    }

    .countdown{
      min-height:1.4em;
      font-size:1.2rem;
      font-weight:600;
    }

    .transport{
      min-height:1.4em;
      font-size:1rem;
      color:#fff;
      font-variant-numeric:tabular-nums;
    }

    .debug{
      font-size:.82rem;
      color:#777;
      min-height:1.2em;
      word-break:break-word;
    }

    .hidden{
      display:none;
    }

    audio{
      width:100%;
    }

    input[type="datetime-local"]{
      color:#fff;
      background:#222;
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator{
      filter:invert(1);
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="header">
      <h1>common</h1>
      <div class="subtitle">v3.7 · interruption-resilient</div>
    </div>

    <label for="startTime">Start Time</label>
    <input id="startTime" type="datetime-local" step="60" />

    <button id="playButton">Begin</button>
    <button id="startNowButton" class="startNow hidden">Begin</button>

    <div id="countdown" class="countdown"></div>
    <div id="status" class="status">Ready.</div>
    <div id="transport" class="transport">00:00 / 00:00 · drift 0 ms</div>
    <div id="driftStats" class="debug">Initial — · Avg — · Best — · Worst —<br>Hard seeks 0 · Last —</div>
    <div id="debug" class="debug"></div>

    <audio id="audio" preload="auto" playsinline class="hidden"></audio>
    <audio id="preshowAudio" preload="auto" playsinline loop class="hidden"></audio>
  </main>

  <script> 
    const AUDIO_URL = "https://eggtooth.xyz/common2audience.mp3";
    const PRESHOW_AUDIO_URL = "https://eggtooth.xyz/preshow.mp3";
    const TIME_SERVER_URL = "https://sync1.jbechs.workers.dev/";

    const audio = document.getElementById("audio");
    const preshowAudio = document.getElementById("preshowAudio");
    const playButton = document.getElementById("playButton");
    const startNowButton = document.getElementById("startNowButton");
    const startInput = document.getElementById("startTime");
    const statusEl = document.getElementById("status");
    const countdownEl = document.getElementById("countdown");
    const transportEl = document.getElementById("transport");
    const driftStatsEl = document.getElementById("driftStats");
    const debugEl = document.getElementById("debug");

    let countdownFrame = null;
    let countdownTimer = null;
    let readinessInterval = null;
    let driftInterval = null;
    let transportInterval = null;
    let crossfadeInterval = null;

    let scheduledAnchorMs = null;
    let sourceAssigned = false;
    let preshowSourceAssigned = false;
    let preshowPlaying = false;
    let waitingForManualStart = false;
    let startAttempted = false;
    let lastDriftSec = 0;
    let lastHardSeekAtMs = 0;
    let initialDriftSec = null;
    let driftSampleCount = 0;
    let driftAbsSumSec = 0;
    let bestAbsDriftSec = null;
    let worstAbsDriftSec = null;
    let hardSeekCount = 0;
    let lastSeekBeforeSec = null;
    let lastSeekAfterSec = null;
    let lastSuccessfulHardSeekAtMs = null;
    let lastSeekAfter1Sec = null;
    let lastSeekAfter3Sec = null;
    let seekSettlingToken = 0;
    let samplesUnder150 = 0;
    let samplesUnder250 = 0;
    let samplesUnderThreshold = 0;
    let samplesAtOrAboveThreshold = 0;
    let sustainedBadStreak = 0;
    let serverClockOffsetMs = 0;
    let lastClockSyncDebug = "";
    let performanceClockFrozen = false;
    let frozenSyncedEpochMs = null;
    let frozenPerformanceNowMs = null;
    let networkWasOnlineAtCurtain = null;
    let startNowMode = "begin";
    let interruptionRecoveryTimer = null;
    let interruptionRecoveryInFlight = false;
    let interruptionAwaitingTap = false;
    let interruptionCount = 0;
    let interruptionAutoRecoveries = 0;
    let interruptionManualRecoveries = 0;

    const START_BUFFER_SEC = 15;
    const LATE_JOIN_BUFFER_SEC = 1.0;
    const SEEK_PLAYABLE_TIMEOUT_MS = 12000;

    const READINESS_CHECK_MS = 500;
    const DRIFT_CHECK_MS = 1000;
    const TRANSPORT_UPDATE_MS = 1000;

    // Production philosophy (Aug 2026): minimum intervention + network indifference.
    // Normal media URL remains intact; the browser is allowed to warm its own media cache/buffer.
    // 350 ms remains the preferred operating band for diagnostics.
    // A hard seek now requires a sustained poor state: >=420 ms for
    // three consecutive 1-second checks, plus the existing cooldown.
    // After six successful hard seeks, the controller concedes for the rest of the run
    // and prioritizes uninterrupted playback over further correction attempts.
    const PREFERRED_DRIFT_BAND_SEC = 0.35;
    const HARD_SEEK_TRIGGER_SEC = 0.42;
    const HARD_SEEK_REQUIRED_CHECKS = 3;
    const HARD_SEEK_COOLDOWN_MS = 8000;
    const HARD_SEEK_MAX_COUNT = 6;
    const NORMAL_RATE = 1.0;
    const INTERRUPTION_RECOVERY_DELAY_MS = 700;

    const PRESHOW_VOLUME = 1.0;
    const MAIN_VOLUME = 1.0;
    const CROSSFADE_MS = 1000;
    const FADE_STEP_MS = 50;

    function highResNowMs(){
      return performance.timeOrigin + performance.now();
    }

    function syncedNowMs(){
      if(performanceClockFrozen && frozenSyncedEpochMs != null && frozenPerformanceNowMs != null){
        return frozenSyncedEpochMs + (performance.now() - frozenPerformanceNowMs);
      }

      return highResNowMs() + serverClockOffsetMs;
    }

    function freezePerformanceClock(){
      if(performanceClockFrozen) return;

      frozenSyncedEpochMs = highResNowMs() + serverClockOffsetMs;
      frozenPerformanceNowMs = performance.now();
      performanceClockFrozen = true;
      networkWasOnlineAtCurtain = navigator.onLine;
    }

    function unfreezePerformanceClock(){
      performanceClockFrozen = false;
      frozenSyncedEpochMs = null;
      frozenPerformanceNowMs = null;
      networkWasOnlineAtCurtain = null;
    }

    function setStatus(msg){
      statusEl.textContent = msg;
    }

    function setCountdown(msg){
      countdownEl.textContent = msg;
    }

    function setDebug(msg){
      debugEl.textContent = msg || "";
    }

    function showPlayer(){
      audio.classList.remove("hidden");
      audio.controls = false;
    }

    function hidePlayer(){
      audio.classList.add("hidden");
      audio.controls = false;
    }

    function showStartNow(mode = "begin"){
      startNowMode = mode;
      startNowButton.textContent = mode === "resume" ? "Resume" : "Begin";
      startNowButton.classList.remove("hidden");
    }

    function hideStartNow(){
      startNowButton.classList.add("hidden");
      if(startNowMode !== "resume") startNowButton.textContent = "Begin";
    }

    function clearTimers(){
      if(countdownFrame){
        cancelAnimationFrame(countdownFrame);
        countdownFrame = null;
      }

      if(countdownTimer){
        clearTimeout(countdownTimer);
        countdownTimer = null;
      }

      if(readinessInterval){
        clearInterval(readinessInterval);
        readinessInterval = null;
      }
    }

    function clearPlaybackMonitors(){
      if(driftInterval){
        clearInterval(driftInterval);
        driftInterval = null;
      }

      if(transportInterval){
        clearInterval(transportInterval);
        transportInterval = null;
      }
    }

    function clearCrossfade(){
      if(crossfadeInterval){
        clearInterval(crossfadeInterval);
        crossfadeInterval = null;
      }
    }

    function resetPlaybackRate(){
      audio.playbackRate = NORMAL_RATE;
    }

    function assignSourceIfNeeded(){
      if(sourceAssigned) return;

      audio.src = AUDIO_URL;
      audio.preload = "auto";
      sourceAssigned = true;
    }

    function assignPreshowSourceIfNeeded(){
      if(preshowSourceAssigned) return;

      preshowAudio.src = PRESHOW_AUDIO_URL;
      preshowAudio.preload = "auto";
      preshowAudio.loop = true;
      preshowSourceAssigned = true;
    }

    function lockBeginButton(){
      playButton.disabled = true;
      playButton.textContent = "In Progress";
      playButton.style.opacity = "0.4";
    }

    function unlockBeginButton(){
      playButton.disabled = false;
      playButton.textContent = "Begin";
      playButton.style.opacity = "1";
    }

    function formatCountdown(ms){
      const s = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(s / 60);
      const sec = s % 60;

      return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }

    function formatClockTime(sec){
      sec = Math.max(0, sec || 0);

      const whole = Math.floor(sec);
      const m = Math.floor(whole / 60);
      const s = whole % 60;

      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function updateTransport(){
      const current = audio.currentTime || 0;
      const duration = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
      const driftMs = Math.round(lastDriftSec * 1000);

      transportEl.textContent =
        `${formatClockTime(current)} / ${formatClockTime(duration)} · drift ${driftMs} ms`;
    }

    function formatSignedMs(sec){
      if(sec == null) return "—";
      const ms = Math.round(sec * 1000);
      return `${ms > 0 ? "+" : ""}${ms} ms`;
    }

    function formatElapsedSince(ms){
      if(ms == null) return "—";
      const totalSec = Math.max(0, Math.floor((highResNowMs() - ms) / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return m > 0 ? `${m}m ${s}s ago` : `${s}s ago`;
    }

    function recordDriftSample(driftSec){
      if(!isFinite(driftSec)) return;

      if(initialDriftSec == null){
        initialDriftSec = driftSec;
      }

      const absDrift = Math.abs(driftSec);
      driftSampleCount += 1;
      driftAbsSumSec += absDrift;
      bestAbsDriftSec = bestAbsDriftSec == null ? absDrift : Math.min(bestAbsDriftSec, absDrift);
      worstAbsDriftSec = worstAbsDriftSec == null ? absDrift : Math.max(worstAbsDriftSec, absDrift);

      if(absDrift < 0.15) samplesUnder150 += 1;
      if(absDrift < 0.25) samplesUnder250 += 1;
      if(absDrift < PREFERRED_DRIFT_BAND_SEC){
        samplesUnderThreshold += 1;
      }else{
        samplesAtOrAboveThreshold += 1;
      }
    }

    function updateDriftStats(){
      const avgAbsSec = driftSampleCount > 0 ? driftAbsSumSec / driftSampleCount : null;
      const improvementSec = initialDriftSec == null ? null : Math.abs(initialDriftSec) - Math.abs(lastDriftSec);
      const improvementText = improvementSec == null ? "—" : `${Math.round(improvementSec * 1000)} ms`;
      const pct = count => driftSampleCount > 0 ? `${Math.round((count / driftSampleCount) * 100)}%` : "—";

      let lastSeekText = "—";
      if(lastSeekBeforeSec != null && lastSeekAfterSec != null){
        lastSeekText = `${formatSignedMs(lastSeekBeforeSec)} → ${formatSignedMs(lastSeekAfterSec)} · ${formatElapsedSince(lastSuccessfulHardSeekAtMs)}`;
      }

      let settlingText = "—";
      if(lastSeekAfterSec != null){
        settlingText = `immediate ${formatSignedMs(lastSeekAfterSec)} · 1s ${formatSignedMs(lastSeekAfter1Sec)} · 3s ${formatSignedMs(lastSeekAfter3Sec)}`;
      }

      driftStatsEl.innerHTML =
        `Initial ${formatSignedMs(initialDriftSec)} · Avg ${avgAbsSec == null ? "—" : `${Math.round(avgAbsSec * 1000)} ms`} · ` +
        `Best ${bestAbsDriftSec == null ? "—" : `${Math.round(bestAbsDriftSec * 1000)} ms`} · ` +
        `Worst ${worstAbsDriftSec == null ? "—" : `${Math.round(worstAbsDriftSec * 1000)} ms`}<br>` +
        `Under 150 ${pct(samplesUnder150)} · Under 250 ${pct(samplesUnder250)} · Under 350 ${pct(samplesUnderThreshold)} · Above 350 ${pct(samplesAtOrAboveThreshold)}<br>` +
        `Bad-state streak ${sustainedBadStreak}/${HARD_SEEK_REQUIRED_CHECKS} (≥420 ms) · Hard seeks ${hardSeekCount}/${HARD_SEEK_MAX_COUNT}${hardSeekCount >= HARD_SEEK_MAX_COUNT ? " · LIMIT REACHED" : ""}<br>` +
        `Interruptions ${interruptionCount} · recovered ${interruptionAutoRecoveries + interruptionManualRecoveries} (${interruptionAutoRecoveries} auto · ${interruptionManualRecoveries} tap)<br>` +
        `${getNetworkResilienceText()} · Network ${navigator.onLine ? "online" : "offline"}<br>` +
        `Improvement ${improvementText} · Last ${lastSeekText}<br>` +
        `Post-seek settling: ${settlingText}`;
    }

    function resetDriftStats(){
      initialDriftSec = null;
      driftSampleCount = 0;
      driftAbsSumSec = 0;
      bestAbsDriftSec = null;
      worstAbsDriftSec = null;
      hardSeekCount = 0;
      lastSeekBeforeSec = null;
      lastSeekAfterSec = null;
      lastSuccessfulHardSeekAtMs = null;
      lastSeekAfter1Sec = null;
      lastSeekAfter3Sec = null;
      seekSettlingToken += 1;
      samplesUnder150 = 0;
      samplesUnder250 = 0;
      samplesUnderThreshold = 0;
      samplesAtOrAboveThreshold = 0;
      sustainedBadStreak = 0;
      updateDriftStats();
    }

    async function syncServerClock(samples = 5){
      let bestSample = null;

      for(let i = 0; i < samples; i++){
        try{
          const t0 = highResNowMs();

          const response = await fetch(TIME_SERVER_URL, {
            cache: "no-store"
          });

          if(!response.ok){
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          const t1 = highResNowMs();

          if(typeof data.now !== "number"){
            throw new Error("Bad time response");
          }

          const roundTripMs = t1 - t0;
          const estimatedServerNow = data.now + (roundTripMs / 2);
          const offsetMs = estimatedServerNow - t1;

          const sample = {
            offsetMs,
            roundTripMs
          };

          if(!bestSample || sample.roundTripMs < bestSample.roundTripMs){
            bestSample = sample;
          }
        }catch(err){
          if(i === samples - 1 && !bestSample){
            serverClockOffsetMs = 0;
            lastClockSyncDebug = `Clock sync failed: ${err.message}`;
            setDebug(lastClockSyncDebug);
            return false;
          }
        }

        await new Promise(resolve => setTimeout(resolve, 80));
      }

      if(bestSample){
        serverClockOffsetMs = bestSample.offsetMs;

        lastClockSyncDebug =
          `Clock offset ${Math.round(serverClockOffsetMs)} ms · RTT ${Math.round(bestSample.roundTripMs)} ms`;

        setDebug(lastClockSyncDebug);
        return true;
      }

      serverClockOffsetMs = 0;
      lastClockSyncDebug = "Clock sync unavailable; using device clock.";
      setDebug(lastClockSyncDebug);
      return false;
    }

    async function ensureMetadata(timeoutMs = 30000){
      assignSourceIfNeeded();

      if(audio.readyState >= 1 && isFinite(audio.duration) && audio.duration > 0){
        return true;
      }

      return new Promise((resolve, reject)=>{
        const timeout = setTimeout(()=>{
          cleanup();
          reject(new Error("Metadata timeout"));
        }, timeoutMs);

        function onLoaded(){
          cleanup();
          resolve(true);
        }

        function onError(){
          cleanup();
          reject(new Error("Audio load error"));
        }

        function cleanup(){
          clearTimeout(timeout);
          audio.removeEventListener("loadedmetadata", onLoaded);
          audio.removeEventListener("error", onError);
        }

        audio.addEventListener("loadedmetadata", onLoaded);
        audio.addEventListener("error", onError);
        audio.load();
      });
    }

    async function ensurePreshowMetadata(timeoutMs = 15000){
      assignPreshowSourceIfNeeded();

      if(preshowAudio.readyState >= 1){
        return true;
      }

      return new Promise(resolve=>{
        const timeout = setTimeout(()=>{
          cleanup();
          resolve(false);
        }, timeoutMs);

        function onLoaded(){
          cleanup();
          resolve(true);
        }

        function onError(){
          cleanup();
          resolve(false);
        }

        function cleanup(){
          clearTimeout(timeout);
          preshowAudio.removeEventListener("loadedmetadata", onLoaded);
          preshowAudio.removeEventListener("error", onError);
        }

        preshowAudio.addEventListener("loadedmetadata", onLoaded);
        preshowAudio.addEventListener("error", onError);
        preshowAudio.load();
      });
    }

    function waitForSeek(){
      return new Promise(resolve=>{
        if(!audio.seeking){
          resolve();
          return;
        }

        audio.addEventListener("seeked", resolve, { once:true });
      });
    }

    function waitForPlayableAt(targetTimeSec, timeoutMs = SEEK_PLAYABLE_TIMEOUT_MS){
      return new Promise(resolve=>{
        const startedAt = highResNowMs();
        let interval = null;
        let finished = false;

        function isPlayable(){
          if(audio.readyState >= 3) return true;

          const bufferedEnd = getBufferedEndFor(targetTimeSec);
          return bufferedEnd > targetTimeSec + LATE_JOIN_BUFFER_SEC;
        }

        function cleanup(){
          if(interval){
            clearInterval(interval);
            interval = null;
          }

          audio.removeEventListener("canplay", onPlayable);
          audio.removeEventListener("canplaythrough", onPlayable);
          audio.removeEventListener("progress", onPlayable);
          audio.removeEventListener("loadeddata", onPlayable);
        }

        function finish(value){
          if(finished) return;
          finished = true;
          cleanup();
          resolve(value);
        }

        function onPlayable(){
          if(isPlayable()){
            finish(true);
          }
        }

        if(isPlayable()){
          finish(true);
          return;
        }

        audio.addEventListener("canplay", onPlayable);
        audio.addEventListener("canplaythrough", onPlayable);
        audio.addEventListener("progress", onPlayable);
        audio.addEventListener("loadeddata", onPlayable);

        interval = setInterval(()=>{
          if(isPlayable()){
            finish(true);
            return;
          }

          if(highResNowMs() - startedAt >= timeoutMs){
            finish(false);
          }
        }, 200);
      });
    }

    async function primeAudioElement(){
      try{
        assignSourceIfNeeded();

        audio.muted = true;
        await audio.play();

        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;

        await waitForSeek();

        return true;
      }catch(err){
        audio.muted = false;
        return false;
      }
    }

    function startDownload(){
      assignSourceIfNeeded();
      audio.preload = "auto";
      audio.load();

      assignPreshowSourceIfNeeded();
      preshowAudio.preload = "auto";
      preshowAudio.load();
    }

    async function startPreshowLoop(){
      assignPreshowSourceIfNeeded();

      try{
        await ensurePreshowMetadata();

        clearCrossfade();

        preshowAudio.loop = true;
        preshowAudio.muted = false;
        preshowAudio.volume = PRESHOW_VOLUME;

        if(preshowAudio.paused){
          await preshowAudio.play();
        }

        preshowPlaying = true;
        return true;
      }catch(err){
        preshowPlaying = false;
        setDebug(`${lastClockSyncDebug} · Pre-show audio blocked or unavailable: ${err.message}`);
        return false;
      }
    }

    function stopPreshowImmediately(){
      clearCrossfade();

      preshowAudio.pause();

      try{
        preshowAudio.currentTime = 0;
      }catch(err){
        // Ignore seek errors on partially loaded mobile audio.
      }

      preshowAudio.volume = PRESHOW_VOLUME;
      preshowPlaying = false;
    }

    function crossfadeFromPreshowToMain(){
      clearCrossfade();

      const startedAt = highResNowMs();

      audio.volume = 0;
      audio.muted = false;

      if(!preshowPlaying || preshowAudio.paused){
        audio.volume = MAIN_VOLUME;
        return;
      }

      crossfadeInterval = setInterval(()=>{
        const elapsed = highResNowMs() - startedAt;
        const progress = Math.min(1, elapsed / CROSSFADE_MS);

        audio.volume = MAIN_VOLUME * progress;
        preshowAudio.volume = PRESHOW_VOLUME * (1 - progress);

        if(progress >= 1){
          clearCrossfade();

          audio.volume = MAIN_VOLUME;
          stopPreshowImmediately();
        }
      }, FADE_STEP_MS);
    }

    function getBufferedEndFor(targetTimeSec){
      try{
        if(audio.buffered.length === 0) return 0;

        for(let i = 0; i < audio.buffered.length; i++){
          const start = audio.buffered.start(i);
          const end = audio.buffered.end(i);

          if(targetTimeSec >= start && targetTimeSec <= end){
            return end;
          }
        }

        return 0;
      }catch(err){
        return 0;
      }
    }

    function getBufferedCoverage(){
      try{
        if(!isFinite(audio.duration) || audio.duration <= 0 || audio.buffered.length === 0){
          return { seconds: 0, percent: 0, full: false };
        }

        let total = 0;
        for(let i = 0; i < audio.buffered.length; i++){
          total += Math.max(0, audio.buffered.end(i) - audio.buffered.start(i));
        }

        const percent = Math.max(0, Math.min(100, (total / audio.duration) * 100));
        const full = percent >= 99 || (audio.buffered.length === 1 && audio.buffered.start(0) <= 0.25 && audio.buffered.end(0) >= audio.duration - 0.5);
        return { seconds: total, percent, full };
      }catch(err){
        return { seconds: 0, percent: 0, full: false };
      }
    }

    function getNetworkResilienceText(){
      const coverage = getBufferedCoverage();
      const bufferText = coverage.full ? "Main audio fully buffered" : `Main audio buffer ${Math.round(coverage.percent)}%`;
      const lockText = performanceClockFrozen ? "Clock frozen" : "Clock live";
      return `${lockText} · ${bufferText}`;
    }

    function hasBufferedThrough(targetTimeSec){
      try{
        if(audio.buffered.length === 0) return false;

        for(let i = 0; i < audio.buffered.length; i++){
          const start = audio.buffered.start(i);
          const end = audio.buffered.end(i);

          if(targetTimeSec >= start && targetTimeSec <= end - 0.25){
            return true;
          }
        }

        return false;
      }catch(err){
        return false;
      }
    }

    function hasEnoughToStartAt(offsetSec){
      if(!audio.duration || !isFinite(audio.duration)) return false;

      if(offsetSec < 1){
        return audio.readyState >= 3 || audio.buffered.length > 0;
      }

      return hasBufferedThrough(offsetSec + START_BUFFER_SEC);
    }

    function getExpectedTrackTimeSec(){
      if(scheduledAnchorMs == null) return null;

      return Math.max(0, (syncedNowMs() - scheduledAnchorMs) / 1000);
    }

    function getCurrentDriftSec(){
      const expected = getExpectedTrackTimeSec();

      if(expected == null) return 0;

      return expected - audio.currentTime;
    }

    async function hardSyncToExpectedTime(reason, preSeekDriftSec){
      const expected = getExpectedTrackTimeSec();

      if(expected == null) return false;
      if(!isFinite(audio.duration) || expected >= audio.duration) return false;

      const bufferedEnd = getBufferedEndFor(expected);

      if(bufferedEnd > expected + 1){
        audio.currentTime = expected;
        await waitForSeek();

        lastDriftSec = getCurrentDriftSec();
        hardSeekCount += 1;
        lastSeekBeforeSec = preSeekDriftSec;
        lastSeekAfterSec = lastDriftSec;
        lastSuccessfulHardSeekAtMs = highResNowMs();
        lastSeekAfter1Sec = null;
        lastSeekAfter3Sec = null;
        const thisSeekToken = ++seekSettlingToken;

        setTimeout(()=>{
          if(thisSeekToken !== seekSettlingToken || audio.paused || audio.ended) return;
          lastSeekAfter1Sec = getCurrentDriftSec();
          updateDriftStats();
        }, 1000);

        setTimeout(()=>{
          if(thisSeekToken !== seekSettlingToken || audio.paused || audio.ended) return;
          lastSeekAfter3Sec = getCurrentDriftSec();
          updateDriftStats();
        }, 3000);

        setStatus(reason);
        updateTransport();
        updateDriftStats();
        return true;
      }else{
        setStatus("Sync delayed — buffering");
        setDebug(`Need audio near ${formatClockTime(expected)} before correcting.`);
        return false;
      }
    }

    function checkDriftStabilityFirst(){
      if(audio.paused || audio.ended || scheduledAnchorMs == null) return;

      const driftSec = getCurrentDriftSec();
      lastDriftSec = driftSec;
      recordDriftSample(driftSec);
      updateDriftStats();

      const absDriftSec = Math.abs(driftSec);
      if(absDriftSec >= HARD_SEEK_TRIGGER_SEC){
        sustainedBadStreak += 1;
      }else{
        sustainedBadStreak = 0;
      }
      updateDriftStats();

      const nowMs = highResNowMs();
      const cooldownElapsed = nowMs - lastHardSeekAtMs >= HARD_SEEK_COOLDOWN_MS;
      const sustainedBadState = sustainedBadStreak >= HARD_SEEK_REQUIRED_CHECKS;
      const correctionLimitReached = hardSeekCount >= HARD_SEEK_MAX_COUNT;

      if(correctionLimitReached){
        // Concede for the remainder of this run. Continued seeking would create
        // more audience disturbance than the stable residual drift is worth.
        sustainedBadStreak = 0;
        setStatus("Playing · correction limit reached");
        updateDriftStats();
        updateTransport();
        return;
      }

      if(sustainedBadState && cooldownElapsed){
        lastHardSeekAtMs = nowMs;
        sustainedBadStreak = 0;
        hardSyncToExpectedTime(
          `Seek correction after sustained drift (${Math.round(driftSec * 1000)} ms)`,
          driftSec
        );
      }else{
        setStatus("Playing");
        updateTransport();
      }
    }

    function beginPlaybackMonitors(){
      clearPlaybackMonitors();

      driftInterval = setInterval(checkDriftStabilityFirst, DRIFT_CHECK_MS);
      transportInterval = setInterval(updateTransport, TRANSPORT_UPDATE_MS);
    }


    function performanceShouldBePlaying(){
      if(!performanceClockFrozen || scheduledAnchorMs == null || audio.ended) return false;
      if(!isFinite(audio.duration) || audio.duration <= 0) return false;

      const expected = getExpectedTrackTimeSec();
      return expected != null && expected >= 0 && expected < audio.duration - 0.25;
    }

    function clearInterruptionRecoveryTimer(){
      if(interruptionRecoveryTimer){
        clearTimeout(interruptionRecoveryTimer);
        interruptionRecoveryTimer = null;
      }
    }

    function offerResumeAfterInterruption(detail = "Audio interrupted"){
      clearInterruptionRecoveryTimer();
      interruptionAwaitingTap = true;
      waitingForManualStart = false;
      startNowButton.disabled = false;
      showStartNow("resume");
      setStatus(`${detail} — tap Resume`);
      setDebug(`${lastClockSyncDebug || "Clock prepared"} · Performance clock preserved; Resume will rejoin the live show position.`);
      updateDriftStats();
    }

    async function recoverInterruptedPlayback(fromUserGesture = false){
      if(interruptionRecoveryInFlight) return false;
      if(!performanceShouldBePlaying()) return false;

      interruptionRecoveryInFlight = true;
      clearInterruptionRecoveryTimer();

      try{
        let expected = getExpectedTrackTimeSec();
        if(expected == null || !isFinite(expected)) return false;
        expected = Math.max(0, Math.min(expected, audio.duration - 0.05));

        // Re-use the same principle as late join: the frozen show clock is truth.
        // If the target is already buffered, jump directly there before resuming.
        const bufferedEnd = getBufferedEndFor(expected);
        if(bufferedEnd > expected + 0.25){
          audio.currentTime = expected;
          await waitForSeek();
        }

        audio.muted = false;
        audio.volume = MAIN_VOLUME;
        await audio.play();

        if(audio.paused) throw new Error("Playback remained paused");

        interruptionAwaitingTap = false;
        startNowMode = "begin";
        hideStartNow();
        lockBeginButton();
        lastDriftSec = getCurrentDriftSec();

        if(fromUserGesture){
          interruptionManualRecoveries += 1;
        }else{
          interruptionAutoRecoveries += 1;
        }

        setStatus("Playing");
        setDebug(`${lastClockSyncDebug || "Clock prepared"} · Recovered from interruption at ${formatClockTime(audio.currentTime)}; show clock preserved.`);
        updateTransport();
        updateDriftStats();
        return true;
      }catch(err){
        offerResumeAfterInterruption("Audio interrupted");
        return false;
      }finally{
        interruptionRecoveryInFlight = false;
      }
    }

    function scheduleAutomaticInterruptionRecovery(reason = "Audio interrupted"){
      if(!performanceShouldBePlaying() || !audio.paused || interruptionRecoveryInFlight) return;
      if(interruptionAwaitingTap && document.visibilityState === "visible") return;

      clearInterruptionRecoveryTimer();
      setStatus(`${reason} — recovering…`);

      interruptionRecoveryTimer = setTimeout(()=>{
        interruptionRecoveryTimer = null;
        if(!performanceShouldBePlaying() || !audio.paused) return;
        recoverInterruptedPlayback(false);
      }, INTERRUPTION_RECOVERY_DELAY_MS);
    }

    function handleUnexpectedPerformancePause(){
      updateTransport();
      if(!performanceShouldBePlaying()) return;

      interruptionCount += 1;
      updateDriftStats();

      // A visible-page pause can be an audio-route loss. Auto-resuming here could
      // unexpectedly blast the soundtrack through the phone speaker, so require
      // one deliberate tap. If the page is hidden (e.g. phone call/app interruption),
      // preserve the clock and attempt an automatic rejoin when the page returns.
      if(document.visibilityState === "hidden"){
        interruptionAwaitingTap = true;
        setStatus("Audio interrupted — waiting to recover");
        return;
      }

      offerResumeAfterInterruption("Audio interrupted");
    }

    async function handleResumeTap(){
      startNowButton.disabled = true;
      try{
        const recovered = await recoverInterruptedPlayback(true);
        if(!recovered && performanceShouldBePlaying()){
          offerResumeAfterInterruption("Audio interrupted");
        }
      }finally{
        startNowButton.disabled = false;
      }
    }

    async function startPlaybackAtCurrentCorrectOffset(){
      if(scheduledAnchorMs == null){
        throw new Error("No scheduled anchor");
      }

      await ensureMetadata();

      // Performance lock: from this point forward the synchronized show clock
      // is derived from the last good server offset plus performance.now().
      // Network changes cannot alter the show timeline.
      freezePerformanceClock();

      let offsetSec = Math.max(0, (syncedNowMs() - scheduledAnchorMs) / 1000);

      if(!isFinite(audio.duration) || offsetSec >= audio.duration){
        stopPreshowImmediately();
        setStatus("Start time is beyond the end of the audio");
        return false;
      }

      audio.pause();
      resetPlaybackRate();

      const isLateJoin = offsetSec >= 1;

      if(isLateJoin){
        setStatus("Joining in progress…");
        setDebug(`${lastClockSyncDebug} · Seeking to ${formatClockTime(offsetSec)}.`);

        audio.currentTime = offsetSec;
        await waitForSeek();

        const playable = await waitForPlayableAt(offsetSec);

        if(!playable){
          setStatus("Still buffering…");
          setDebug(`${lastClockSyncDebug} · Tap Begin again if needed.`);
          return false;
        }

        offsetSec = Math.max(0, (syncedNowMs() - scheduledAnchorMs) / 1000);

        if(offsetSec < audio.duration){
          audio.currentTime = offsetSec;
          await waitForSeek();
        }
      }else{
        if(!hasEnoughToStartAt(offsetSec)){
          setStatus("Preparing audio…");
          setDebug(`Waiting for larger mobile buffer at ${formatClockTime(offsetSec)}.`);
          return false;
        }

        audio.currentTime = offsetSec;
        await waitForSeek();
      }

      showPlayer();

      if(preshowPlaying && !preshowAudio.paused){
        audio.volume = 0;
      }else{
        audio.volume = MAIN_VOLUME;
      }

      audio.muted = false;

      await audio.play();

      crossfadeFromPreshowToMain();

      lockBeginButton();
      waitingForManualStart = false;
      startAttempted = true;

      hideStartNow();
      setCountdown("");
      setStatus("Playing");
      setDebug(`${lastClockSyncDebug || "Clock prepared"} · ${getNetworkResilienceText()} · Network changes ignored during performance.`);

      lastDriftSec = getCurrentDriftSec();

      updateTransport();
      beginPlaybackMonitors();

      return true;
    }

    async function tryAutomaticStart(){
      if(startAttempted) return;

      startAttempted = true;

      try{
        const started = await startPlaybackAtCurrentCorrectOffset();

        if(!started){
          startAttempted = false;
          waitingForManualStart = true;
          showStartNow();
          setStatus("Ready — tap Begin");
        }
      }catch(err){
        startAttempted = false;
        waitingForManualStart = true;
        showStartNow();
        setStatus("Tap Begin");
        setDebug(`Automatic start was blocked: ${err.message}`);
      }
    }

    function beginCountdown(startTimeMs){
      clearTimers();
      startAttempted = false;

      readinessInterval = setInterval(()=>{
        const offsetSec = Math.max(0, (syncedNowMs() - startTimeMs) / 1000);
        const bufferedEnd = getBufferedEndFor(offsetSec);
        const bufferedAhead = Math.max(0, bufferedEnd - offsetSec);

        const coverage = getBufferedCoverage();
        if(hasEnoughToStartAt(offsetSec)){
          setDebug(`${lastClockSyncDebug} · Audio ready. Buffer ahead ${bufferedAhead.toFixed(1)}s · total buffered ${Math.round(coverage.percent)}%.`);
        }else{
          setDebug(`${lastClockSyncDebug} · Preloading audio. Buffer ahead ${bufferedAhead.toFixed(1)}s · total buffered ${Math.round(coverage.percent)}%.`);
        }
      }, READINESS_CHECK_MS);

      function updateCountdown(){
        const remaining = startTimeMs - syncedNowMs();

        if(remaining <= 0){
          clearTimers();
          setCountdown("Starting now");
          tryAutomaticStart();
          return;
        }

        setCountdown(`Starting in ${formatCountdown(remaining)}`);
        setStatus(preshowPlaying ? "Pre-show playing…" : "Downloading…");

        countdownFrame = requestAnimationFrame(updateCountdown);
      }

      updateCountdown();

      countdownTimer = setTimeout(()=>{
        clearTimers();
        setCountdown("Starting now");
        tryAutomaticStart();
      }, Math.max(0, startTimeMs - syncedNowMs()));
    }

    async function handlePrepare(){
      clearTimers();
      clearPlaybackMonitors();
      clearCrossfade();
      resetPlaybackRate();
      unfreezePerformanceClock();

      stopPreshowImmediately();
      startNowMode = "begin";
      hideStartNow();
      waitingForManualStart = false;
      startAttempted = false;
      lastDriftSec = 0;
      lastHardSeekAtMs = 0;
      resetDriftStats();
      audio.volume = MAIN_VOLUME;

      setDebug("");

      if(!startInput.value){
        setStatus("Enter a start time");
        return;
      }

      if(!AUDIO_URL.startsWith("http")){
        setStatus("Add your audio URL first");
        return;
      }

      playButton.disabled = true;

      try{
        hidePlayer();
        startDownload();
        setStatus("Syncing clock…");

        await syncServerClock();

        setStatus("Downloading…");

        await ensureMetadata();
        updateTransport();

        await primeAudioElement();

        const startTimeMs = new Date(startInput.value).getTime();
        const offsetSec = (syncedNowMs() - startTimeMs) / 1000;

        scheduledAnchorMs = startTimeMs;

        if(offsetSec < 0){
          await startPreshowLoop();
          beginCountdown(startTimeMs);
          setStatus(preshowPlaying ? "Pre-show playing…" : "Downloading…");
        }else{
          stopPreshowImmediately();
          setCountdown("");
          setStatus("Tap Begin to join");
          waitingForManualStart = true;
          showStartNow();
          setDebug(`${lastClockSyncDebug} · Start time is already in the past; Begin will jump to the correct offset.`);
        }
      }catch(err){
        stopPreshowImmediately();
        setStatus("Audio source did not load");
        setDebug(`Load failed: ${err.message}`);
      }finally{
        if(!startAttempted){
          playButton.disabled = false;
        }
      }
    }

    async function handleManualStart(){
      if(scheduledAnchorMs == null){
        setStatus("Tap Begin first");
        return;
      }

      startNowButton.disabled = true;

      try{
        const started = await startPlaybackAtCurrentCorrectOffset();

        if(!started){
          showStartNow();
        }
      }catch(err){
        setStatus("Start failed");
        setDebug(`Manual start failed: ${err.message}`);
        showStartNow();
      }finally{
        startNowButton.disabled = false;
      }
    }

    playButton.addEventListener("click", handlePrepare);
    startNowButton.addEventListener("click", ()=>{
      if(startNowMode === "resume"){
        handleResumeTap();
      }else{
        handleManualStart();
      }
    });

    audio.addEventListener("loadedmetadata", ()=>{
      updateTransport();
      setDebug(lastClockSyncDebug || "");
    });

    audio.addEventListener("durationchange", updateTransport);
    audio.addEventListener("timeupdate", updateTransport);
    audio.addEventListener("seeking", updateTransport);
    audio.addEventListener("seeked", updateTransport);

    audio.addEventListener("progress", ()=>{
      updateTransport();

      if(waitingForManualStart && scheduledAnchorMs != null){
        const offsetSec = Math.max(0, (syncedNowMs() - scheduledAnchorMs) / 1000);
        const bufferedEnd = getBufferedEndFor(offsetSec);
        const bufferedAhead = Math.max(0, bufferedEnd - offsetSec);

        if(offsetSec >= 1){
          setDebug(`${lastClockSyncDebug} · Ready to seek/join at ${formatClockTime(offsetSec)}.`);
        }else if(hasEnoughToStartAt(offsetSec)){
          const coverage = getBufferedCoverage();
          setStatus("Ready — tap Begin");
          setDebug(`${lastClockSyncDebug} · Audio ready. Buffer ahead ${bufferedAhead.toFixed(1)}s · total buffered ${Math.round(coverage.percent)}%.`);
        }else{
          const coverage = getBufferedCoverage();
          setDebug(`${lastClockSyncDebug} · Buffering. Buffer ahead ${bufferedAhead.toFixed(1)}s · total buffered ${Math.round(coverage.percent)}%.`);
        }
      }
    });

    audio.addEventListener("canplay", ()=>{
      updateTransport();

      if(waitingForManualStart && scheduledAnchorMs != null){
        setStatus("Ready — tap Begin");
      }
    });

    audio.addEventListener("waiting", ()=>{
      if(!audio.ended && !audio.paused){
        setStatus("Buffering…");
      }
    });

    audio.addEventListener("stalled", ()=>{
      if(!audio.ended && !audio.paused){
        setStatus("Network/audio stalled");
        setDebug("Phone may need more buffered audio before stable playback.");
      }
    });

    audio.addEventListener("playing", ()=>{
      clearInterruptionRecoveryTimer();
      interruptionAwaitingTap = false;
      if(startNowMode === "resume"){
        startNowMode = "begin";
        hideStartNow();
      }
      lockBeginButton();
      setStatus("Playing");
      updateTransport();
    });

    audio.addEventListener("pause", handleUnexpectedPerformancePause);

    audio.addEventListener("ended", ()=>{
      clearTimers();
      clearPlaybackMonitors();
      clearCrossfade();
      resetPlaybackRate();
      unfreezePerformanceClock();
      stopPreshowImmediately();

      waitingForManualStart = false;
      startAttempted = false;

      setCountdown("");
      setStatus("Playback ended");
      setDebug(lastClockSyncDebug || "");

      showPlayer();
      updateTransport();
    });

    audio.addEventListener("error", ()=>{
      stopPreshowImmediately();
      setStatus("Audio failed to load");
      setDebug("Check custom domain, public bucket, CORS, and direct MP3 URL.");
      unlockBeginButton();
    });

    preshowAudio.addEventListener("error", ()=>{
      preshowPlaying = false;
      setDebug(`${lastClockSyncDebug} · Pre-show audio failed to load.`);
    });

    function noteNetworkChange(){
      updateDriftStats();

      // During the performance, connectivity changes are deliberately ignored.
      // Playback continues from the browser's ordinary media buffer/cache and
      // the frozen monotonic show clock. No reload, resync, or seek is triggered.
      if(performanceClockFrozen && !audio.paused && !audio.ended){
        setDebug(`${lastClockSyncDebug || "Clock prepared"} · ${getNetworkResilienceText()} · Network changed to ${navigator.onLine ? "online" : "offline"}; playback untouched.`);
      }
    }

    window.addEventListener("online", noteNetworkChange);
    window.addEventListener("offline", noteNetworkChange);

    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "visible" && performanceShouldBePlaying() && audio.paused){
        scheduleAutomaticInterruptionRecovery("Returning to performance");
      }
    });

    window.addEventListener("pageshow", ()=>{
      if(performanceShouldBePlaying() && audio.paused){
        scheduleAutomaticInterruptionRecovery("Returning to performance");
      }
    });

    updateTransport();
    updateDriftStats();
  </script>
</body>
</html>
